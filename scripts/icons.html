<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Icons erzeugen</title>
<style>body{font-family:sans-serif;padding:20px} canvas{margin:8px;border:1px solid #ccc}</style></head>
<body>
<h1>App-Icons aus dem Adler rendern</h1>
<p>Server mit <code>node scripts/serve.mjs 8765 --icons</code> starten, dann diese Seite unter <code>http://localhost:8765/scripts/icons.html</code> öffnen. Die PNGs werden direkt nach <code>icons/</code> geschrieben.</p>
<button id="go">Icons erzeugen und speichern</button> <span id="log"></span>
<div id="out"></div>
<script type="module">
import { eagleSvg } from "../js/art.js";
const log = (t) => document.getElementById("log").textContent = t;
async function render(size, pad = 0.1) {
  const c = document.createElement("canvas"); c.width = c.height = size; const g = c.getContext("2d");
  g.fillStyle = "#0f766e"; g.beginPath(); g.roundRect(0, 0, size, size, size * 0.22); g.fill();
  const grd = g.createRadialGradient(size * .5, size * .35, size * .05, size * .5, size * .5, size * .8);
  grd.addColorStop(0, "rgba(255,255,255,.18)"); grd.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = grd; g.fillRect(0, 0, size, size);
  const svg = eagleSvg("idle", 200).replace(/class="[^"]*"/, "");
  const img = new Image(); await new Promise((r) => { img.onload = r; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  const s = size * (1 - 2 * pad); g.drawImage(img, size * pad, size * pad + size * .02, s, s);
  document.getElementById("out").append(c);
  return new Promise((r) => c.toBlob(r, "image/png"));
}
document.getElementById("go").onclick = async () => {
  const files = { "icon-192.png": 192, "icon-512.png": 512, "apple-touch-icon.png": 180 };
  for (const [name, size] of Object.entries(files)) {
    const blob = await render(size);
    const r = await fetch("../icons/" + name, { method: "PUT", body: blob });
    log(await r.text());
    if (!r.ok) return;
  }
  log("Fertig: icon-192, icon-512, apple-touch-icon geschrieben.");
};
</script></body></html>
